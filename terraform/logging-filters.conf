[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc.cluster.local:443
    Buffer_Size         ${K8S_BUFFER_SIZE}
    Merge_Log           On
    Keep_Log            Off
    Labels              Off
    Annotations         Off
[FILTER]
    Name                grep
    Match               kube.*
    Regex               application ^oficina-mecanica-dgcar$
[FILTER]
    Name                nest
    Match               kube.*
    Operation           lift
    Nested_under        kubernetes
[FILTER]
    Name                record_modifier
    Match               *
    Record              cluster_name ${CLUSTER_NAME}
