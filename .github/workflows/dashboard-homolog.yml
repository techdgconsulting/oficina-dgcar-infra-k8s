name: Atualizar Dashboard Negocio Homolog

on:
  push:
    branches: [homolog]
    paths:
      - terraform/observability.tf
      - scripts/observability/**
      - .github/workflows/dashboard-homolog.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Escopo da observabilidade
        type: choice
        default: business
        options: [business, inspect]

permissions:
  contents: read

concurrency:
  group: ambiente-academico-homolog
  cancel-in-progress: false

jobs:
  dashboard:
    if: github.ref == 'refs/heads/homolog' || inputs.scope == 'inspect'
    runs-on: ubuntu-latest
    environment: homolog
    env:
      TF_VAR_environment: homolog
      TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_new_relic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID || vars.NEW_RELIC_ACCOUNT_ID }}
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
      NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID || vars.NEW_RELIC_ACCOUNT_ID }}
      DASHBOARD_VALIDATION_API_URL: ${{ secrets.API_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
      - name: Inspect operational telemetry (read only)
        if: inputs.scope == 'inspect'
        run: |
          aws eks update-kubeconfig --name oficina-dgcar-homolog-eks --region us-east-1
          python3 scripts/observability/inspect-operational.py
      - name: Initialize existing state
        if: inputs.scope != 'inspect'
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true"
      - name: Validate Terraform
        if: inputs.scope != 'inspect'
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform validate
      - name: Plan business dashboard only
        if: inputs.scope != 'inspect'
        working-directory: terraform
        run: |
          terraform plan -target=newrelic_one_dashboard.business -out=dashboard.tfplan
          terraform show -json dashboard.tfplan > dashboard-plan.json
      - name: Validate scope and execute dashboard queries in New Relic
        if: inputs.scope != 'inspect'
        run: python3 scripts/observability/validate-business-dashboard.py terraform/dashboard-plan.json
      - name: Apply reviewed dashboard plan
        if: inputs.scope != 'inspect'
        working-directory: terraform
        run: terraform apply -input=false dashboard.tfplan
