name: Validar Infra K8s

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main
      - homolog

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Disable remote backend for offline validation
        working-directory: terraform
        run: mv backend.tf backend.tf.disabled

      - name: Terraform init without remote state
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan without refresh
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          TF_VAR_environment: homolog
          TF_VAR_api_backend_url: ""
          TF_VAR_auth_lambda_invoke_arn: ""
          TF_VAR_auth_lambda_function_name: ""
          TF_VAR_enable_github_actions_eks_access: "true"
          TF_VAR_github_actions_iam_user_arn: arn:aws:iam::123456789012:user/github-actions-oficina-dgcar
          TF_VAR_github_actions_iam_user_name: github-actions-oficina-dgcar
        run: terraform plan -refresh=false

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s > rendered-k8s.yaml
          test -s rendered-k8s.yaml

      - name: Validate shell scripts
        run: bash -n scripts/preflight/*.sh scripts/github-actions/*.sh scripts/aws/*.sh scripts/smoke/*.sh
