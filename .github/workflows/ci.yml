name: Infra K8s

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main
      - homolog
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      environment:
        description: "Target environment"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - prod

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Disable remote backend for offline validation
        working-directory: terraform
        run: mv backend.tf backend.tf.disabled

      - name: Terraform init without remote state
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan without refresh
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'homolog' }}
          TF_VAR_api_backend_url: ${{ secrets.API_BACKEND_URL || '' }}
          TF_VAR_auth_lambda_invoke_arn: ${{ secrets.AUTH_LAMBDA_INVOKE_ARN || '' }}
          TF_VAR_auth_lambda_function_name: ${{ secrets.AUTH_LAMBDA_FUNCTION_NAME || '' }}
        run: terraform plan -refresh=false

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s > rendered-k8s.yaml
          test -s rendered-k8s.yaml

  apply:
    name: apply
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform init with remote state
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_api_backend_url: ${{ secrets.API_BACKEND_URL || '' }}
          TF_VAR_auth_lambda_invoke_arn: ${{ secrets.AUTH_LAMBDA_INVOKE_ARN || '' }}
          TF_VAR_auth_lambda_function_name: ${{ secrets.AUTH_LAMBDA_FUNCTION_NAME || '' }}
        run: terraform apply -auto-approve

      - name: Publish network outputs to dependent repositories
        working-directory: terraform
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          AUTH_LAMBDA_REPO: techdgconsulting/oficina-dgcar-auth-lambda
          INFRA_DB_REPO: techdgconsulting/oficina-dgcar-infra-db
        run: |
          VPC_ID="$(terraform output -raw vpc_id)"
          PRIVATE_SUBNET_IDS="$(terraform output -json private_subnet_ids)"
          EKS_CLUSTER_SECURITY_GROUP_ID="$(terraform output -raw eks_cluster_security_group_id)"
          ALLOWED_DB_SECURITY_GROUP_IDS="[\"${EKS_CLUSTER_SECURITY_GROUP_ID}\"]"

          gh secret set VPC_ID --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$VPC_ID"
          gh secret set PRIVATE_SUBNET_IDS --repo "$AUTH_LAMBDA_REPO" --env "$TARGET_ENVIRONMENT" --body "$PRIVATE_SUBNET_IDS"

          gh secret set VPC_ID --repo "$INFRA_DB_REPO" --env "$TARGET_ENVIRONMENT" --body "$VPC_ID"
          gh secret set PRIVATE_SUBNET_IDS --repo "$INFRA_DB_REPO" --env "$TARGET_ENVIRONMENT" --body "$PRIVATE_SUBNET_IDS"
          gh secret set ALLOWED_DB_SECURITY_GROUP_IDS --repo "$INFRA_DB_REPO" --env "$TARGET_ENVIRONMENT" --body "$ALLOWED_DB_SECURITY_GROUP_IDS"
